<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Elite Tracking App</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --bg-base: #050505; --bg-surface: #121217; --accent: #ff2a5f; --text-primary: #fff; --text-secondary: #8e8e9e; --radius-lg: 24px; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', 'Cairo', sans-serif; }
        body { background-color: var(--bg-base); color: var(--text-primary); padding: 20px; padding-bottom: 120px; }
        .container { max-width: 800px; margin: 0 auto; }
        .header-card { background: var(--bg-surface); padding: 25px; border-radius: var(--radius-lg); border-left: 4px solid var(--accent); margin-bottom: 25px; }
        .client-name { font-size: 2.2rem; font-weight: 900; text-transform: uppercase; }
        .booking-card { background: linear-gradient(145deg, #1e1e28, #16161d); border: 1px solid rgba(255,42,95,0.3); border-radius: 16px; padding: 20px; margin-bottom: 30px; text-align: center; }
        .booking-card input { background: #000; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 8px; margin-bottom: 15px; width: 100%; max-width: 300px; }
        .booking-card button { background: var(--accent); color: #fff; border: none; padding: 12px 25px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        .week-switcher { display: flex; gap: 10px; overflow-x: auto; margin-bottom: 20px; }
        .week-btn { background: var(--bg-surface); color: var(--text-secondary); padding: 12px 24px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); font-weight: bold; cursor: pointer; }
        .week-btn.active { background: var(--accent); color: #fff; }
        .day-view { display: none; }
        .day-view.active { display: block; }
        .day-header { font-size: 1.5rem; font-weight: 900; margin: 25px 0 15px 0; border-bottom: 1px solid #222; padding-bottom: 5px; }
        .ex-card { background: var(--bg-surface); padding: 20px; border-radius: var(--radius-lg); margin-bottom: 25px; border: 1px solid rgba(255,255,255,0.05); }
        .sub-name { font-weight: 700; font-size: 1.1rem; color: #fff; margin-bottom: 5px; }
        .sub-meta { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 15px; }
        .sets-grid { display: grid; gap: 10px; }
        .set-row { display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.02); padding: 10px; border-radius: 8px; }
        .set-row.completed { border-left: 4px solid #00ff88; background: rgba(0,255,136,0.03); }
        .input-wrap { display: flex; flex-direction: column; align-items: center; }
        .input-wrap label { font-size: 0.65rem; color: var(--text-secondary); margin-bottom: 2px; }
        .input-wrap input { width: 70px; background: #000; color: #fff; border: 1px solid #333; padding: 6px; text-align: center; border-radius: 6px; font-weight: bold; }
        .check-btn { width: 35px; height: 35px; background: #222; border: none; color: #555; border-radius: 8px; cursor: pointer; }
        .set-row.completed .check-btn { background: #00ff88; color: #000; }
        .tech-hint { font-size: 0.85rem; color: #ffb800; background: rgba(255,184,0,0.05); padding: 8px; border-radius: 6px; margin-bottom: 10px; text-align: right; direction: rtl; }
        .yt-btn { color: #ff0000; text-decoration: none; font-size: 1.2rem; margin-left: 10px; }
        .rest-card { background: #121217; padding: 40px; border-radius: 24px; text-align: center; border: 1px dashed #333; }
        .rest-card i { font-size: 3rem; color: var(--accent); margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-card">
            <div class="client-name" id="uiClientName">Loading Plan...</div>
            <div id="uiMeta"></div>
            <div class="notes-box" id="uiNotes"></div>
        </div>

        <div class="booking-card">
            <h3><i class="fas fa-calendar-check"></i> Book Personal Session</h3>
            <input type="datetime-local" id="sessionDateTime">
            <br><button onclick="bookSession()">Confirm Appointment</button>
        </div>

        <div class="week-switcher" id="weekSwitcher"></div>
        <div id="dynamicDaysContainer"></div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://procoachsystem-92c45-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const urlParams = new URLSearchParams(window.location.search);
        let clientParam = urlParams.get('client');
        if(!clientParam) {
            clientParam = prompt("Enter Client ID / Name:");
        }
        const safeClient = clientParam ? clientParam.replace(" ", "_").replace(".", "") : "Unknown";
        const clientRef = db.ref('clients/' + safeClient);

        let activeWeek = 1;

        clientRef.child('plan').once('value').then(snapshot => {
            const plan = snapshot.val();
            if(!plan) {
                document.getElementById('uiClientName').innerText = "No Plan Found on Cloud Server.";
                return;
            }

            document.getElementById('uiClientName').innerText = plan.meta.client;
            document.getElementById('uiMeta').innerHTML = `<span style="color:#ff2a5f">Goal:</span> ${plan.meta.goal} | <span style="color:#ff2a5f">Phase:</span> ${plan.meta.phase}`;
            if(plan.meta.notes) document.getElementById('uiNotes').innerHTML = `<b>Notes:</b><br>${plan.meta.notes.replace(/\n/g, '<br>')}`;

            const switcher = document.getElementById('weekSwitcher');
            for(let w=1; w<=plan.meta.weeks; w++) {
                switcher.innerHTML += `<button class="week-btn ${w===1?'active':''}" id="wbtn_${w}" onclick="switchWeek(${w})">WEEK ${w}</button>`;
            }

            const container = document.getElementById('dynamicDaysContainer');
            for(let w=1; w<=plan.meta.weeks; w++) {
                // قراءة كألف مصفوفة مرتبة لمنع اختلال الـ dayIdx تماماً ومطابقته للـ Dashboard
                if (plan.days && Array.isArray(plan.days)) {
                    plan.days.forEach((dayObj, dayIdx) => {
                        let dayTitle = dayObj.day_title;
                        let exercises = dayObj.exercises || [];
                        
                        let isVisible = (w === 1 && dayIdx === 0) ? 'block' : 'none';
                        let dayDiv = document.createElement('div');
                        dayDiv.className = `day-view wview_${w}`;
                        dayDiv.id = `view_w${w}_d${dayIdx}`;
                        dayDiv.style.display = isVisible;
                        
                        let header = document.createElement('h2');
                        header.className = "day-header";
                        header.innerText = dayTitle;
                        dayDiv.appendChild(header);

                        if(dayTitle.toLowerCase().includes('rest') || exercises.length === 0) {
                            dayDiv.innerHTML += `<div class="rest-card"><i class="fas fa-battery-full"></i><h2>REST DAY</h2><p>Recovery mode activated.</p></div>`;
                        } else {
                            let merged = mergeExercises(exercises);
                            let exSeq = 1;
                            merged.forEach(ex => {
                                let card = document.createElement('div');
                                card.className = "ex-card";
                                
                                let titleRow = `<div class="ex-title-row"><div class="ex-title">${exSeq}. ${ex.exercise}</div>`;
                                if(ex.technique !== "Normal") titleRow += `<div class="tech-pill">${ex.technique}</div>`;
                                titleRow += `</div>`;
                                card.innerHTML += titleRow;

                                let subExs = ex.sub_exercises || [ex];
                                subExs.forEach((sub, subIdx) => {
                                    let subDiv = document.createElement('div');
                                    subDiv.style.marginTop = "15px";
                                    let subTitle = `<div class="sub-name">${sub.exercise}`;
                                    if(sub.link) subTitle += `<a href="${sub.link}" target="_blank" class="yt-btn"><i class="fab fa-youtube"></i></a>`;
                                    subTitle += `</div>`;
                                    card.innerHTML += subTitle;
                                    if(sub.note) card.innerHTML += `<div style="color:#38bdf8;font-size:0.85rem;margin-bottom:5px;">Note: ${sub.note}</div>`;
                                    card.innerHTML += `<div class="sub-meta">Target: <b>${sub.sets}</b> | Rest: <b>${sub.rest}</b></div>`;

                                    let numSets = parseSets(sub.sets);
                                    let grid = document.createElement('div');
                                    grid.className = "sets-grid";
                                    for(let s=1; s<=numSets; s++) {
                                        let inpBase = `w${w}_d${dayIdx}_e${exSeq}_s${subIdx}_set${s}`;
                                        grid.innerHTML += `
                                            <div class="set-row" id="row_${inpBase}">
                                                <span>Set ${s}</span>
                                                <div class="input-wrap"><label>KG</label><input type="text" id="w_${inpBase}" onchange="sendCloud('${inpBase}')"></div>
                                                <div class="input-wrap"><label>Reps</label><input type="text" id="r_${inpBase}" onchange="sendCloud('${inpBase}')"></div>
                                                <button class="check-btn" id="chk_${inpBase}" onclick="clickCheck('${inpBase}')"><i class="fas fa-check"></i></button>
                                            </div>`;
                                    }
                                    card.appendChild(grid);
                                });

                                dayDiv.appendChild(card);
                                exSeq++;
                            });
                        }
                        container.appendChild(dayDiv);
                    });
                }
            }
            loadLiveProgress();
        });

        function mergeExercises(exs) {
            let merged = [];
            let i = 0;
            while(i < exs.length) {
                let ex = exs[i];
                if(["Super set", "Tri-set", "Circuit", "Giant Sets"].includes(ex.technique)) {
                    let size = ex.technique === "Tri-set" ? 3 : 2;
                    if(ex.technique === "Circuit") size = 99;
                    let group = [ex];
                    let j = i + 1;
                    while(j < exs.length && exs[j].technique === ex.technique && group.length < size) {
                        group.push(exs[j]); j++;
                    }
                    if(group.length > 1) {
                        merged.push({ exercise: group.map(g=>g.exercise).join(" x "), technique: ex.technique, sub_exercises: group });
                    } else { merged.push(ex); }
                    i = j;
                } else { merged.push(ex); i++; }
            }
            return merged;
        }

        function parseSets(str) {
            let s = String(str).toLowerCase().replace(/\s/g,'');
            if(s.includes('x')) return parseInt(s.split('x')[0]) || 3;
            return parseInt(s) || 3;
        }

        function switchWeek(w) {
            activeWeek = w;
            document.querySelectorAll('.week-btn').forEach((b,i)=>b.classList.toggle('active', i===(w-1)));
            document.querySelectorAll('.day-view').forEach(d=>d.style.display='none');
            document.querySelectorAll(`.wview_${w}`).forEach(d=>d.style.display='block');
        }

        function sendCloud(idBase) {
            let wg = document.getElementById('w_' + idBase).value;
            let rp = document.getElementById('r_' + idBase).value;
            if(wg) clientRef.child('inputs/w_' + idBase).set(wg);
            if(rp) clientRef.child('inputs/r_' + idBase).set(rp);
        }

        function clickCheck(idBase) {
            let row = document.getElementById('row_' + idBase);
            row.classList.toggle('completed');
            clientRef.child('checks/' + idBase).set(row.classList.contains('completed'));
        }

        function bookSession() {
            let dt = document.getElementById('sessionDateTime').value;
            if(!dt) return alert("Select date/time");
            clientRef.child('bookings').push({ datetime: dt, status: 'Pending' });
            alert("Appointment sent to Coach dashboard!");
        }

        function loadLiveProgress() {
            clientRef.on('value', snap => {
                let d = snap.val();
                if(!d) return;
                if(d.inputs) {
                    for(let [id, v] of Object.entries(d.inputs)) {
                        let el = document.getElementById(id);
                        if(el) el.value = v;
                    }
                }
                if(d.checks) {
                    for(let [id, val] of Object.entries(d.checks)) {
                        let row = document.getElementById('row_' + id);
                        if(row) row.classList.toggle('completed', val);
                    }
                }
            });
        }
    </script>
</body>
</html>
